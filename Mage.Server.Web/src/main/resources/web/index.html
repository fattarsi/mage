<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>XMage Web — Play vs AI</title>
    <style>
        * { box-sizing: border-box; }
        :root { --card-w: 104px; --bf-card-w: 78px; --opp-card-w: 78px; }
        body { font-family: system-ui, sans-serif; margin: 0; background: #14161a; color: #e7e7e7; }
        header { padding: 8px 14px; background: #1f242c; border-bottom: 1px solid #333;
                 display: flex; align-items: center; gap: 14px; }
        header b { color: #cfe; }
        #status { font-size: 12px; color: #8bd; }
        #turn { font-size: 12px; color: #fc9; margin-left: auto; }
        #board { padding: 10px 14px; }
        /* phase progress bar (sticky at top while scrolling) */
        #phasebar { display: flex; gap: 2px; flex-wrap: wrap; position: sticky; top: 0; z-index: 35;
                    background: #14161a; margin: -10px -14px 10px; padding: 8px 14px; border-bottom: 1px solid #262d38; }
        /* collapsible zone chips (graveyard / exile / emblems) */
        .collapzone { border: 1px solid #3a4658; border-radius: 6px; padding: 4px 7px; background: #1a1e24; }
        .collap-hdr { cursor: pointer; font-size: 11px; color: #cdd; white-space: nowrap; user-select: none; }
        .collap-hdr:hover { color: #fff; }
        .myzones, .oppzones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: flex-start; }
        .manapool { font-size: 12px; }
        .manapool .mana { font-weight: 700; }
        #phasebar .ph { flex: 1 1 auto; text-align: center; font-size: 10px; padding: 4px 3px; border-radius: 4px;
                        background: #1b2028; color: #8090a0; border: 1px solid #262d38; white-space: nowrap; }
        #phasebar .ph.cur { background: #2e5a8a; color: #fff; font-weight: 700; border-color: #3a6ea8; }
        #phasebar .ph.bp { box-shadow: inset 0 0 0 2px #d76; } /* breakpoint set */
        #phasebar .ph.clickable { cursor: pointer; }
        #phasebar .ph.clickable:hover { background: #2b3340; color: #cde; }
        .player { border: 1px solid #2b313b; border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #1a1e24; }
        .player.me { background: #1a221c; }
        /* subtle yellow border marks whose turn it is */
        .player.activeturn { border-color: #c9a84a; box-shadow: 0 0 0 1px rgba(201,168,74,.35); }
        /* multiplayer: opponents are compact by default; click the 🔍 to zoom one open as an overlay */
        #opponents { display: flex; gap: 8px; align-items: flex-start; }
        #opponents.multi > .player { flex: 1; }
        .player.compact .zone .card { width: 52px; min-height: 73px; font-size: 8px; padding: 2px 2px 10px; }
        .player.compact .card .rules { display: none; }
        /* a zoomed opponent expands as an overlay above the other play areas (not confined to its column) */
        .player.zoomed { position: fixed; top: 50px; left: 10px; right: 356px; max-height: 76vh; overflow: auto;
                         z-index: 45; background: #10141a; border: 2px solid #4a7a5a; box-shadow: 0 10px 40px rgba(0,0,0,.7); }
        .player.zoomed .zone .card, .player.zoomed .bf .card {
            width: var(--card-w); min-height: calc(var(--card-w)*1.4); font-size: 10px; padding: 4px 4px 14px; }
        .player.zoomed .card .rules { display: block; }
        .opp-row { display: flex; gap: 8px; align-items: flex-start; }
        .opp-row .bf { flex: 1; }
        .opp-cmd { flex: 0 0 auto; border: 1px solid #3a4658; border-radius: 6px; padding: 4px 6px; background: #1a1e24; }
        .opp-cmd-hdr { cursor: pointer; font-size: 11px; color: #cdd; white-space: nowrap; user-select: none; }
        .opp-cmd-hdr:hover { color: #fff; }
        .zoombtn { background: #2e3a4a; font-size: 11px; padding: 2px 7px; }
        #zoomwrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9ab; }
        #viewerToggleWrap { font-size: 12px; color: #9ab; display: flex; align-items: center; gap: 4px; }
        /* left sidebar: collapsible commander section + hover card viewer */
        #leftbar { position: fixed; left: 10px; top: 64px; width: 268px; z-index: 40;
                   display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        #commanderPanel { background: #1b212b; border: 1px solid #3a4658; border-radius: 9px; padding: 6px 9px;
                          box-shadow: 0 6px 20px rgba(0,0,0,.45); pointer-events: auto; }
        #commanderHeader { cursor: pointer; font-size: 12px; color: #cdd; font-weight: 600; user-select: none; }
        #commanderHeader:hover { color: #fff; }
        #commanderBody { margin-top: 6px; }
        /* right sidebar: hover card viewer (top) + collapsible log (below) */
        #rightbar { position: fixed; right: 10px; top: 64px; width: 336px; z-index: 40;
                    display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        #viewer { display: none; opacity: 0; transition: opacity .55s ease; width: 100%; background: #1b212b;
                  border: 1px solid #3a4658; border-radius: 9px; padding: 9px; box-shadow: 0 8px 28px rgba(0,0,0,.55);
                  pointer-events: auto; }
        body.viewer-on #viewer.has-card { display: block; }
        #viewer.show { opacity: 1; }
        #viewerInfo .vpr { color: #8fd29a; font-size: 12px; margin-top: 4px; }
        #arrows { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 38; }
        #logBar { border-top: 1px solid #2b313b; background: #1b2028; padding: 4px 14px 8px; }
        #logHeader { cursor: pointer; font-size: 12px; color: #9ab; font-weight: 600; user-select: none; padding: 4px 0; }
        #logHeader:hover { color: #fff; }
        #logSearchWrap { display: flex; align-items: center; gap: 8px; padding: 0 0 4px; }
        #logSearch { flex: 1 1 auto; background: #11161d; color: #e7ecf2; border: 1px solid #2b313b;
                     border-radius: 5px; padding: 4px 8px; font-size: 12px; }
        #logSearch:focus { outline: 0; border-color: #4767a0; }
        #log .hit mark { background: #5d4a12; color: #ffe9a8; border-radius: 2px; padding: 0 1px; }
        #viewerImg { width: 100%; border-radius: 7px; display: block; background: #11151b; }
        #viewerInfo { margin-top: 7px; font-size: 12.5px; line-height: 1.35; }
        #viewerInfo .vc { float: right; color: #ad8; }
        #viewerInfo .vn { font-weight: 700; color: #e7ecf2; }
        #viewerInfo .vt { color: #9ab; font-size: 11.5px; margin: 3px 0; }
        #viewerInfo .vpt { color: #fe9; font-weight: 700; margin: 2px 0; }
        #viewerInfo .vr { color: #cdd; font-size: 11.5px; margin-top: 5px; white-space: pre-line;
                          border-top: 1px solid #2c3340; padding-top: 5px; }
        .phead { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 6px; }
        .pname { font-weight: 700; }
        .life { color: #f88; font-weight: 700; }
        .meta { color: #9aa; font-size: 12px; }
        .active { color: #7f7; }
        .zone-label { font-size: 11px; color: #789; margin: 4px 0 2px; text-transform: uppercase; letter-spacing: .04em; }
        .zone { display: flex; flex-wrap: wrap; gap: 5px; min-height: 8px; }
        /* battlefield: type rows, with their own (smaller) card size */
        .bf { display: flex; flex-direction: column; gap: 3px; }
        .bf .card { width: var(--bf-card-w); min-height: calc(var(--bf-card-w) * 1.4); }
        /* opponents get their own card size (when not compacted into the multi-player thumbnails or zoomed) */
        #opponents > .player:not(.compact):not(.zoomed) .bf .card {
            width: var(--opp-card-w); min-height: calc(var(--opp-card-w) * 1.4); }
        .bf .zone-label { margin: 2px 0 1px; }
        /* settings dropdown */
        #settingsBtn { background: #3a4150; font-size: 12px; padding: 5px 12px; }
        #settings { position: fixed; top: 44px; right: 10px; z-index: 60; width: 280px; background: #1c2230;
                    border: 1px solid #3a4658; border-radius: 9px; padding: 12px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
        #settings .setrow { margin: 8px 0; font-size: 13px; color: #bcd; }
        #settings .setrow label { display: block; margin-bottom: 3px; }
        #settings input[type=range] { width: 100%; }
        .card { width: var(--card-w); min-height: calc(var(--card-w) * 1.4); border: 1px solid #3a4150;
                border-radius: 6px; padding: 4px 4px 14px; font-size: 10px; background: #232a33; cursor: default;
                position: relative; line-height: 1.3; overflow: hidden; transition: width .12s, min-height .12s; }
        .card .cn { display: block; white-space: normal; word-break: break-word; }
        .card img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
                        border-radius: 5px; }
        .card.clickable { cursor: pointer; border-color: #5a6b86; }
        .card.clickable:hover { border-color: #9cf; background: #2b3340; }
        .card.playable { box-shadow: 0 0 0 2px #4a7; }
        .card.targetable { box-shadow: 0 0 0 3px #fd5; cursor: pointer; }
        .card.dim { opacity: .4; }
        .card.eligible { box-shadow: 0 0 0 3px #ef7d4a; cursor: pointer; } /* combat: eligible attacker/blocker */
        .card.tapped { transform: rotate(8deg); opacity: .8; }
        .phead.clickable { cursor: pointer; padding: 3px 6px; border-radius: 5px; }
        .phead.clickable:hover { background: #2b3340; }
        .phead.targetable { box-shadow: 0 0 0 3px #fd5; border-radius: 5px; }
        .card .cn { font-weight: 700; color: #dde; }
        .card .cc { float: right; color: #ad8; }
        .card .ct { color: #89a; font-size: 9px; }
        .card .pt { position: absolute; right: 4px; bottom: 2px; font-weight: 700; color: #fe9; }
        .card .rules { color: #aab; font-size: 9px; margin-top: 2px; max-height: 40px; overflow: hidden; }
        #stack { border: 1px dashed #56607a; border-radius: 6px; padding: 6px; margin: 8px 0; }
        /* compact skip/pass controls, sitting just under the action bar (beneath the stack) */
        #skipbar { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 0 4px; margin: -2px 0 4px; }
        #skipbar button { background: #2e3a4a; font-size: 11px; padding: 3px 8px; border-radius: 4px; }
        #skipbar button:hover { background: #3d4d63; }
        /* compact action bar sitting directly under the stack */
        #prompt { background: #232a36; border: 1px solid #3a587e; border-radius: 6px;
                  padding: 5px 10px; margin: 6px 0; display: flex; flex-direction: column; gap: 3px; }
        #turninfo { font-size: 12px; font-weight: 600; color: #fc9;
                    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #promptmain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #prompt .msg { font-size: 12.5px; color: #fff; flex: 1 1 200px; }
        #prompt button { padding: 4px 11px; font-size: 12px; }
        .passbtn { background: #2e6a40; }
        .passbtn:hover { background: #3c8a54; }
        button { background: #34507a; color: #fff; border: 0; border-radius: 5px; padding: 7px 14px;
                 font-size: 13px; cursor: pointer; }
        button:hover { background: #4767a0; }
        button.alt { background: #5a3a3a; } button.alt:hover { background: #784c4c; }
        #log { resize: vertical; overflow: auto; height: 150px; min-height: 40px; max-height: 60vh;
               font-size: 11px; color: #8a9; font-family: ui-monospace, monospace; border: 1px solid #2b313b;
               border-radius: 6px; padding: 6px; background: #14181e; }
        #log .sent { color: #9cf; } #log .recv { color: #7a8; } #log .err { color: #f88; font-weight: 700; }
        .card.playable { box-shadow: 0 0 0 3px #5d7; }
        .card.playable::after { content: '▶ play'; position: absolute; left: 4px; bottom: 2px; font-size: 8px; color: #6e9; }
        #banner { display:none; padding: 8px 14px; background: #5a2a2a; color: #fdd; font-size: 13px;
                  white-space: pre-line; }
        input[type=number] { width: 70px; padding: 5px; }
        .over { color: #fe7; font-size: 16px; font-weight: 700; }
        .overlay { position: fixed; inset: 0; background: rgba(8,10,13,.82); display: flex;
                   align-items: center; justify-content: center; z-index: 50; }
        .overlay .panel { width: min(560px, 92vw); background: #1c2230; border: 1px solid #38445a;
                          border-radius: 10px; padding: 18px 20px; }
        .overlay h2 { margin: 0 0 12px; color: #cfe; }
        .overlay label { display: block; font-size: 13px; color: #bcd; margin: 10px 0 4px; }
        .overlay select { padding: 6px; font-size: 14px; min-width: 260px; }
        .overlay textarea { width: 100%; height: 180px; background: #11151b; color: #dde; border: 1px solid #38445a;
                            border-radius: 6px; padding: 8px; font-family: ui-monospace, monospace; font-size: 12px; }
        .overlay .hint { font-size: 11px; color: #89a; margin-top: 8px; }
        .overlay #startBtn { margin-top: 12px; font-size: 15px; padding: 9px 20px; }
        #newGameBtn { background: #2e6a40; font-size: 12px; padding: 5px 12px; }
        #newGameBtn:hover { background: #3c8a54; }
        #resignBtn { background: #7a5a20; font-size: 12px; padding: 5px 12px; }
        #resignBtn:hover { background: #9a7228; }
        #endGameBtn { background: #7a2e2e; font-size: 12px; padding: 5px 12px; }
        #endGameBtn:hover { background: #9a3838; }
    </style>
</head>
<body>
<header>
    <b>XMage Web</b> — play vs AI
    <span id="status">connecting…</span>
    <button id="newGameBtn">New game</button>
    <button id="resignBtn" style="display:none">Resign</button>
    <button id="endGameBtn" style="display:none">End game</button>
    <button id="settingsBtn">⚙ Settings</button>
</header>

<div id="settings" style="display:none">
    <div class="setrow"><label>Hand card size</label><input type="range" id="zoom" min="64" max="220" step="4" value="104"></div>
    <div class="setrow"><label>Battlefield card size</label><input type="range" id="bfzoom" min="44" max="180" step="4" value="78"></div>
    <div class="setrow"><label>Opponent card size</label><input type="range" id="oppzoom" min="44" max="180" step="4" value="78"></div>
    <div class="setrow"><label><input type="checkbox" id="viewerToggle"> Card viewer (hover preview)</label></div>
    <div class="setrow"><label><input type="checkbox" id="soundToggle"> Sound effects</label></div>
    <div class="setrow" style="border-top:1px solid #2c3340; padding-top:8px; margin-top:8px;">
        <b style="color:#cde">When skipping (e.g. “My next turn”), stop if…</b>
    </div>
    <div class="setrow"><label><input type="checkbox" id="stopNewStack" checked> …I can respond (new spell/ability on the stack)</label></div>
    <div class="setrow"><label><input type="checkbox" id="stopBlockers" checked> …I can declare blockers</label></div>
    <div class="setrow"><label><input type="checkbox" id="stopAttackers" checked> …I can declare attackers</label></div>
    <div class="setrow"><label><input type="checkbox" id="stopMains" checked> …at my main phases</label></div>
    <div class="setrow"><label><input type="checkbox" id="stopEnds" checked> …at end steps</label></div>
</div>


<div id="setup" class="overlay" style="display:none">
    <div class="panel">
        <h2>New game vs AI</h2>
        <label for="formatSel">Format</label>
        <select id="formatSel"></select>
        <div id="deckSourceWrap" style="display:none">
            <label for="deckSourceSel">Load a deck from <span id="deckSourceLabel">your site</span></label>
            <select id="deckSourceSel"><option value="">— none (use pasted or random) —</option></select>
        </div>
        <label for="deckInput">Your deck — paste a decklist, or leave blank for a random deck</label>
        <textarea id="deckInput" placeholder="4 Lightning Bolt&#10;4 Monastery Swiftspear&#10;20 Mountain&#10;...&#10;&#10;(plain '<count> <card name>' per line, or paste an XMage .dck)"></textarea>
        <div><button id="startBtn">Start game</button></div>
        <div class="hint">Random decks work for any non-Commander format. Commander needs a real deck with a commander (paste a .dck).</div>
    </div>
</div>

<div id="picker" class="overlay" style="display:none">
    <div class="panel" style="width:min(820px,94vw)">
        <h2 id="pickerMsg">Choose a card</h2>
        <div id="pickerCards" class="zone" style="max-height:62vh;overflow:auto"></div>
        <div style="margin-top:10px"><button id="pickerDone">Done / none</button></div>
    </div>
</div>

<div id="banner"></div>
<div id="board">
    <div id="phasebar"></div>
    <div id="opponents"></div>
    <div id="stack"><div class="zone-label">Stack</div><div id="stackZone" class="zone"></div></div>
    <div id="prompt"><span id="turninfo"></span><span id="promptmain"><span class="msg">waiting…</span></span></div>
    <div id="skipbar"></div>
    <div id="me" class="player me"></div>
</div>

<div id="logBar">
    <div id="logHeader">▸ Log</div>
    <div id="logSearchWrap" style="display:none">
        <input id="logSearch" type="search" placeholder="search log (e.g. a card name)…" autocomplete="off">
        <span id="logCount" class="meta"></span>
    </div>
    <div id="log" style="display:none"></div>
</div>

<div id="rightbar">
    <svg id="arrows" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="ahead-atk" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e55"/></marker>
        <marker id="ahead-blk" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5af"/></marker>
    </defs>
</svg>
<div id="viewer"><img id="viewerImg" alt=""/><div id="viewerInfo"></div></div>
    <div id="commanderPanel" style="display:none">
        <div id="commanderHeader">▸ Commander</div>
        <div id="commanderBody" class="zone" style="display:none"></div>
    </div>
</div>

<script>
const statusEl = document.getElementById('status');
const turnInfoEl = document.getElementById('turninfo');
const opponentsEl = document.getElementById('opponents');
const meEl = document.getElementById('me');
const stackZone = document.getElementById('stackZone');
const promptMain = document.getElementById('promptmain');
const logEl = document.getElementById('log');

// collapsible log panel (right side), collapsed by default; state persisted
let logExpanded = localStorage.getItem('logOpen') === '1';
const logHeader = document.getElementById('logHeader');
const logSearch = document.getElementById('logSearch');
const logCount = document.getElementById('logCount');
const logSearchWrap = document.getElementById('logSearchWrap');
function renderLogHeader() {
    logHeader.textContent = (logExpanded ? '▾ ' : '▸ ') + 'Log';
    logEl.style.display = logExpanded ? 'block' : 'none';
    logSearchWrap.style.display = logExpanded ? 'flex' : 'none';
}
logHeader.onclick = () => { logExpanded = !logExpanded; localStorage.setItem('logOpen', logExpanded ? '1' : '0'); renderLogHeader(); };
logSearch.oninput = applyLogFilter;
renderLogHeader();

// card zoom (persisted)
const zoom = document.getElementById('zoom');
const savedZoom = localStorage.getItem('cardZoom');
if (savedZoom) { zoom.value = savedZoom; document.documentElement.style.setProperty('--card-w', savedZoom + 'px'); }
zoom.oninput = () => {
    document.documentElement.style.setProperty('--card-w', zoom.value + 'px');
    localStorage.setItem('cardZoom', zoom.value);
};
// settings panel toggle
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settings');
settingsBtn.onclick = () => { settingsPanel.style.display = (settingsPanel.style.display === 'none' ? 'block' : 'none'); };
// battlefield card size (smaller than hand by default)
const bfzoom = document.getElementById('bfzoom');
const savedBf = localStorage.getItem('bfZoom');
if (savedBf) { bfzoom.value = savedBf; document.documentElement.style.setProperty('--bf-card-w', savedBf + 'px'); }
bfzoom.oninput = () => {
    document.documentElement.style.setProperty('--bf-card-w', bfzoom.value + 'px');
    localStorage.setItem('bfZoom', bfzoom.value);
};
// opponent card size (independent of my battlefield)
const oppzoom = document.getElementById('oppzoom');
const savedOpp = localStorage.getItem('oppZoom');
if (savedOpp) { oppzoom.value = savedOpp; document.documentElement.style.setProperty('--opp-card-w', savedOpp + 'px'); }
oppzoom.oninput = () => {
    document.documentElement.style.setProperty('--opp-card-w', oppzoom.value + 'px');
    localStorage.setItem('oppZoom', oppzoom.value);
};

// hover card viewer (toggleable, persisted)
const viewerToggle = document.getElementById('viewerToggle');
const viewerEl = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
const viewerInfo = document.getElementById('viewerInfo');
if (localStorage.getItem('viewerOn') === '1') { viewerToggle.checked = true; document.body.classList.add('viewer-on'); }
viewerToggle.onchange = () => {
    document.body.classList.toggle('viewer-on', viewerToggle.checked);
    localStorage.setItem('viewerOn', viewerToggle.checked ? '1' : '0');
};
function scryUrl(card) { return artUrlFor(card); }
// collapsible commander section (left side), hidden by default; click the header to expand
let commanderExpanded = false;
const commanderPanel = document.getElementById('commanderPanel');
const commanderHeader = document.getElementById('commanderHeader');
const commanderBody = document.getElementById('commanderBody');
commanderHeader.onclick = () => { commanderExpanded = !commanderExpanded; if (lastGameView) renderBoard(lastGameView); };
function renderCommanderPanel(commandList) {
    if (!commandList.length) { commanderPanel.style.display = 'none'; return; }
    commanderPanel.style.display = 'block';
    commanderHeader.textContent = (commanderExpanded ? '▾ ' : '▸ ') + 'Commander (' + commandList.length + ')';
    commanderBody.style.display = commanderExpanded ? 'flex' : 'none';
    commanderBody.innerHTML = '';
    if (commanderExpanded) commandList.forEach(c => commanderBody.appendChild(cardEl(c, true))); // click to cast
}

const priceCache = {};
function setViewerPrice(key, txt) {
    if (viewerEl.dataset.key !== key) return;
    const el = viewerInfo.querySelector('.vpr'); if (el) el.textContent = txt;
}
function fetchPrice(set, num, key) {
    fetch('/cardinfo/' + encodeURIComponent(set) + '/' + encodeURIComponent(num))
        .then(r => r.ok ? r.json() : null)
        .then(d => {
            const txt = (d && d.usd) ? ('$' + d.usd + (d.usd_foil ? '  ·  foil $' + d.usd_foil : '')) : 'price n/a';
            priceCache[key] = txt; setViewerPrice(key, txt);
        })
        .catch(() => { priceCache[key] = 'price n/a'; setViewerPrice(key, 'price n/a'); });
}
let viewerHideTimer = null, viewerRemoveTimer = null;
function scheduleHideViewer() {
    clearTimeout(viewerHideTimer);
    viewerHideTimer = setTimeout(() => {
        viewerEl.classList.remove('show'); // start the slow fade-out
        clearTimeout(viewerRemoveTimer);
        viewerRemoveTimer = setTimeout(() => {
            if (!viewerEl.classList.contains('show')) viewerEl.classList.remove('has-card');
        }, 600);
    }, 900); // delay before auto-close begins
}
// hovering the viewer itself keeps it open
viewerEl.onmouseenter = () => { clearTimeout(viewerHideTimer); clearTimeout(viewerRemoveTimer); };
viewerEl.onmouseleave = () => scheduleHideViewer();
function showCardViewer(card) {

function beep(freq, durMs, type, gain, when) {
    if (!soundOn) return;

        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t0 = audioCtx.currentTime + (when || 0);

        osc.type = type || 'sine'; osc.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0);

        g.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs / 1000);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + durMs / 1000 + 0.02);
    } catch (e) {}
}

function soundForFrame(method, data, gv) {

        const m = String(data.message || '');
        (/(you).*(win)|won/i.test(m) ? SFX.win : SFX.lose)();

        SFX.needInput();
    if (!gv || !gv.players) return;
    const me = gv.players.find(p => p.controlled) || gv.players[0];
    const totalLife = gv.players.reduce((s,p) => s + (p.life||0), 0);
    const stackSize = gv.stack ? Object.keys(gv.stack).length : 0;
    const cur = { turn: gv.turn, myLife: me.life, totalLife, stackSize };
    if (snap) {
        if (cur.turn !== snap.turn) SFX.turn();

function logc(cls, s) {

// --- log search: filter to matching lines, highlight the match, jump to the first ---

    const q = logSearch.value.trim().toLowerCase();
    const text = d.textContent;
    if (!q) { d.style.display = ''; d.classList.remove('hit'); d.textContent = text; return false; }
    const idx = text.toLowerCase().indexOf(q);
    if (idx < 0) { d.style.display = 'none'; d.classList.remove('hit'); return false; }
    d.style.display = ''; d.classList.add('hit');
    d.innerHTML = esc(text.slice(0, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>'
        + esc(text.slice(idx + q.length));
    return true;
}

    updateLogCount();

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// Ordered list of art URLs to try for a card. Tokens (collector number "0") are looked up by
// name; normal cards by set+number, and we always fall back to a by-name token search so that
// tokens we failed to detect (or whose set/number art 404s) still resolve instead of going blank.
function artCandidates(card) {
    if (card.faceDown) return [];
    const out = [];
    const rawNum = card.cardNumber || (card.imageNumber ? String(card.imageNumber) : null);
    const set = card.expansionSetCode ? String(card.expansionSetCode).toLowerCase() : null;
    const tokenish = card.isToken || rawNum === '0' || rawNum === 0;
    if (!tokenish && set && rawNum) out.push(`/img/${encodeURIComponent(set)}/${encodeURIComponent(rawNum)}`);
    if (card.name) out.push(`/imgtoken/${encodeURIComponent(card.name)}`);
    return out;
}
function artUrlFor(card) { const c = artCandidates(card); return c.length ? c[0] : null; }
// Point an <img> at a card's art, trying each candidate URL in turn on load failure.
// On final failure: card tiles drop the <img> (text shows through); the viewer just hides it.
function setCardImage(img, card) {
    const urls = artCandidates(card);
    let i = 0;
    img.onerror = () => {
        if (i < urls.length) { img.src = urls[i++]; }
        else { img.onerror = null; if (img.classList.contains('art')) img.remove(); else img.style.display = 'none'; }
    };
    if (urls.length) { img.style.display = ''; img.onerror(); } // kick off the first attempt
    else { img.onerror(); }
}
function untappedLandIds(gv) {
    const me = (gv.players||[]).find(p => p.controlled);
    if (!me || !me.battlefield) return [];
    return Object.entries(me.battlefield)
        .filter(([id,p]) => (p.cardTypes||[]).includes('LAND') && !p.tapped)
        .map(([id]) => id);
}

ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { showError('bad JSON frame'); return; }
    const data = msg.data || {};
    if (msg.method && msg.method.startsWith('GAME_') && msg.method !== 'GAME_UPDATE')
        logc('recv', '← ' + msg.method + (data.message ? ': ' + data.message : ''));
    try {
        // update the valid-target highlight set BEFORE rendering, so highlights show this frame
        if (msg.method === 'GAME_TARGET') validTargets = new Set(data.targets || []);
        else if (msg.method === 'GAME_PLAY_MANA') validTargets = new Set(untappedLandIds(data.gameView || {}));
        else if (ACTIONABLE.has(msg.method)) validTargets = new Set();
        priorityActive = (msg.method === 'GAME_SELECT');
        const rawMsg = String(data.message || '');
        if (msg.method === 'GAME_SELECT' && /select attackers/i.test(rawMsg)) combatMode = 'attack';
        else if (msg.method === 'GAME_SELECT' && /select blockers/i.test(rawMsg)) combatMode = 'block';
        else if (ACTIONABLE.has(msg.method)) combatMode = null;
        const gv = data.gameView || (data.players ? data : null);
        if (gv) { lastGameView = gv; computePlayable(gv); renderBoard(gv); }
        renderPicker(msg.method, data);
        handle(msg.method, data);
        soundForFrame(msg.method, data, gv);
        if (gv) drawArrows(gv);
    } catch (e) {
        showError((e && e.message || e) + ' (method ' + msg.method + ')');
    }
};

function computePlayable(gv) {
    playableIds = new Set();
    const cpo = gv.canPlayObjects;
    if (!cpo) return;
    // PlayableObjectsList shapes vary; collect any UUID-looking keys/ids we can find
    const scan = (o) => {
        if (!o) return;
        if (Array.isArray(o)) o.forEach(scan);
        else if (typeof o === 'object') {
            for (const k in o) {
                if (/^[0-9a-f]{8}-[0-9a-f]{4}-/.test(k)) playableIds.add(k);
                scan(o[k]);
            }
        }
    };
    scan(cpo);
}

function cardEl(card, clickable) {
    const d = document.createElement('div');
    const isTarget = validTargets.has(card.id);
    // at priority, dim hand cards we can't play right now (wrong phase / not enough mana / not our turn)
    const dim = priorityActive && myHandIds.has(card.id) && !playableIds.has(card.id) && !isTarget;
    // during combat, highlight my untapped creatures (eligible attackers/blockers)
    const eligible = combatMode && card.controlled && (card.cardTypes||[]).includes('CREATURE') && !card.tapped;
    d.className = 'card' + (clickable ? ' clickable' : '')
        + (playableIds.has(card.id) ? ' playable' : '')
        + (isTarget ? ' targetable' : '')
        + (eligible ? ' eligible' : '')
        + (dim ? ' dim' : '')
        + (card.tapped ? ' tapped' : '');
    const cost = card.manaCostStr || (Array.isArray(card.manaCost) ? card.manaCost.join('') : '') || '';
    const types = [].concat(card.superTypes||[], card.cardTypes||[], card.subTypes||[]).join(' ');
    const pt = (card.power !== undefined && (card.cardTypes||[]).includes('CREATURE'))
        ? `${card.power}/${card.toughness}` : '';
    if (card.id) d.dataset.cid = card.id; // for combat arrows
    d.innerHTML = `<span class="cc">${esc(cost)}</span><span class="cn">${card.isAbility?'⚡ ':''}${msg(card.name||'?')}</span>`
        + `<div class="ct">${esc(types)}</div>`
        + (card.rules && card.rules.length ? `<div class="rules">${msg(card.rules.join(' • '))}</div>` : '')
        + (pt ? `<div class="pt">${esc(pt)}</div>` : '');
    d.title = strip(`${card.name||'?'}${cost?'  '+cost:''}${pt?'  '+pt:''}`
        + (types?'\n'+types:'') + (card.rules&&card.rules.length?'\n\n'+card.rules.join('\n'):''));
    // real card art (tokens looked up by name, with fallback); on failure the text card shows through
    if (artCandidates(card).length) {
        const img = document.createElement('img');
        img.className = 'art'; img.loading = 'lazy'; img.alt = card.name || '';
        setCardImage(img, card);
        d.appendChild(img);
    }
    d.onmouseenter = () => showCardViewer(card);
    d.onmouseleave = () => scheduleHideViewer();
    if (clickable) d.onclick = () => send('playerUUID', card.id);
    return d;
}

    if (!pool) return '';
    const s = MANA_COLORS.filter(([k]) => pool[k] > 0)
        .map(([k,t,sym,col]) => `<span class="mana" style="color:${col}">${pool[k]}${sym}</span>`).join(' ');
    return s ? ` <span class="manapool" title="floating mana">[ ${s} ]</span>` : '';
}

// combat arrows: attacker -> defender (red), blocker -> attacker (blue), drawn over the board
const SVGNS = 'http://www.w3.org/2000/svg';
function elCenter(selector) {
    const el = document.querySelector(selector);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return null;
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function drawArrow(svg, from, to, marker, color) {
    if (!from || !to) return;
    const line = document.createElementNS(SVGNS, 'line');
    line.setAttribute('x1', from.x); line.setAttribute('y1', from.y);
    line.setAttribute('x2', to.x); line.setAttribute('y2', to.y);
    line.setAttribute('stroke', color); line.setAttribute('stroke-width', '3');
    line.setAttribute('opacity', '0.85'); line.setAttribute('marker-end', marker);
    svg.appendChild(line);
}
function drawArrows(gv) {
    const svg = document.getElementById('arrows');
    // keep the <defs>, clear drawn lines
    [...svg.querySelectorAll('line')].forEach(l => l.remove());
    const groups = (gv && gv.combat) || [];
    for (const g of groups) {
        const defC = elCenter(`[data-cid="${g.defenderId}"]`) || elCenter(`[data-pid="${g.defenderId}"]`);
        const atkIds = Object.keys(g.attackers || {});
        const blkIds = Object.keys(g.blockers || {});
        for (const aid of atkIds) {
            const atkC = elCenter(`[data-cid="${aid}"]`);
            drawArrow(svg, atkC, defC, 'url(#ahead-atk)', '#e55');
            for (const bid of blkIds) drawArrow(svg, elCenter(`[data-cid="${bid}"]`), atkC, 'url(#ahead-blk)', '#5af');
        }
    }
}
// keep arrows aligned when the page scrolls/resizes
let arrowRaf = null;
function scheduleArrows() { if (arrowRaf) return; arrowRaf = requestAnimationFrame(() => { arrowRaf = null; if (lastGameView) drawArrows(lastGameView); }); }
window.addEventListener('scroll', scheduleArrows, true);
window.addEventListener('resize', scheduleArrows);

function classifyPerm(p) {
    const t = p.cardTypes || [];
    if (t.includes('LAND')) return 'land';
    if (t.includes('CREATURE')) return 'creature';
    return 'other';
}
// battlefield laid out as rows by type (playmat convention): creatures up top, then
// artifacts/enchantments/walkers, then lands. Opponents are mirrored (lands at top).
function battlefieldEl(battlefield, mirrored) {
    const wrap = document.createElement('div'); wrap.className = 'bf';
    const groups = { creature: [], other: [], land: [] };
    Object.values(battlefield || {}).forEach(p => groups[classifyPerm(p)].push(p));
    const order = mirrored ? ['land', 'other', 'creature'] : ['creature', 'other', 'land'];
    const labels = { creature: 'Creatures', other: 'Artifacts / Enchantments / Walkers', land: 'Lands' };
    let any = false;
    order.forEach(g => { if (groups[g].length) { any = true; wrap.appendChild(zone(labels[g], groups[g], true)); } });
    if (!any) { const e = document.createElement('div'); e.className = 'meta'; e.textContent = '— empty —'; wrap.appendChild(e); }
    return wrap;
}

function zone(label, cardsMap, clickable) {
    const wrap = document.createElement('div');
    const l = document.createElement('div'); l.className = 'zone-label'; l.textContent = label;
    const z = document.createElement('div'); z.className = 'zone';
    const cards = cardsMap ? Object.values(cardsMap) : [];
    for (const c of cards) z.appendChild(cardEl(c, clickable));
    if (!cards.length) { const e = document.createElement('span'); e.className='meta'; e.textContent='—'; z.appendChild(e); }
    wrap.appendChild(l); wrap.appendChild(z);
    return wrap;
}

function renderBoard(gv) {
    renderPhaseBar(gv);
    const me = gv.players.find(p => p.controlled) || gv.players[0];
    myHandIds = new Set(Object.keys(gv.myHand || {}));
    const myTurn = gv.activePlayerId === me.playerId;
    // inline pass(resolve) button: shown whenever we hold plain priority (not mid combat-declaration),
    // so it's a one-click way to move the game along right next to the stack.
    const stackSize = gv.stack ? Object.keys(gv.stack).length : 0;
    const showPass = priorityActive && !combatMode;
    const passBtn = showPass
        ? `<button type="button" class="passbtn" onclick="passResolve()">${stackSize ? 'pass (resolve) ▸' : 'pass ▸'}</button> · `
        : '';
    turnInfoEl.innerHTML = `T${gv.turn} · ${esc(gv.step||gv.phase||'')} · ` + passBtn
        + (myTurn ? '<span style="color:#7f7">YOUR TURN</span>' : '<span style="color:#fa8">opp turn</span>');

    function pheadHtml(p, active, isOpp) {
        const tgt = validTargets.has(p.playerId) ? ' targetable' : '';
        const zoomBtn = isOpp
            ? `<button class="zoombtn" onclick="event.stopPropagation(); toggleOppZoom('${p.playerId}')">${oppZoomed[p.playerId] ? '✕ close' : '🔍 zoom'}</button> `
            : '';
        return `<div class="phead clickable${tgt}" data-pid="${p.playerId}" onclick="pickPlayer('${p.playerId}')" title="click to target this player">`
            + zoomBtn
            + `<span class="pname">${esc(p.name)}</span> `
            + `<span class="life">♥ ${p.life}</span> `
            + `<span class="meta">hand ${p.handCount} · lib ${p.libraryCount} · gy ${Object.keys(p.graveyard||{}).length}</span>`
            + manaPoolHtml(p.manaPool)
            + (active ? ` <span class="active">● active</span>` : '') + `</div>`;
    }

    // opponents: compact + hover-to-zoom when there's more than one (3-4 player games)
    const opponents = gv.players.filter(p => p !== me);
    opponentsEl.innerHTML = '';
    opponentsEl.className = opponents.length > 1 ? 'multi' : '';
    for (const opp of opponents) {
        const panel = document.createElement('div');
        const zoomed = !!oppZoomed[opp.playerId];
        panel.className = 'player' + (opponents.length > 1 && !zoomed ? ' compact' : '') + (zoomed ? ' zoomed' : '')
            + (gv.activePlayerId === opp.playerId ? ' activeturn' : '');
        panel.innerHTML = pheadHtml(opp, gv.activePlayerId === opp.playerId, true);
        // battlefield + a collapsed commander section to its right
        const row = document.createElement('div'); row.className = 'opp-row';
        row.appendChild(battlefieldEl(opp.battlefield, true)); // mirrored; clickable as targets
        if (opp.commandList && opp.commandList.length) row.appendChild(oppCommanderEl(opp));
        panel.appendChild(row);
        // opponent graveyard / exile chips
        const oz = document.createElement('div'); oz.className = 'oppzones';
        oz.appendChild(collapsibleZone('Graveyard', opp.graveyard, 'gy-' + opp.playerId));
        oz.appendChild(collapsibleZone('Exile', opp.exile, 'ex-' + opp.playerId));
        panel.appendChild(oz);
        opponentsEl.appendChild(panel);
    }

    meEl.className = 'player me' + (myTurn ? ' activeturn' : '');
    meEl.innerHTML = pheadHtml(me, myTurn);
    meEl.appendChild(battlefieldEl(me.battlefield, false));
    // graveyard / exile / emblems as collapsible chips
    const myZones = document.createElement('div'); myZones.className = 'myzones';
    myZones.appendChild(collapsibleZone('Graveyard', me.graveyard, 'my-gy'));
    myZones.appendChild(collapsibleZone('Exile', me.exile, 'my-exile'));
    if (gv.myHelperEmblems && Object.keys(gv.myHelperEmblems).length)
        myZones.appendChild(collapsibleZone('Emblems', gv.myHelperEmblems, 'my-emblems'));
    meEl.appendChild(myZones);
    meEl.appendChild(zone('My hand (' + Object.keys(gv.myHand || {}).length + ')', gv.myHand, true));

    // my commander lives in the collapsible left-side panel
    renderCommanderPanel(me.commandList || []);

    stackZone.innerHTML = '';
    const stack = gv.stack ? Object.values(gv.stack) : [];
    if (!stack.length) stackZone.innerHTML = '<span class="meta">empty</span>';
    else stack.forEach(c => stackZone.appendChild(cardEl(c, false)));
}

// Some dialogs (library search like Terramorphic Expanse, reveal, choose-from-pile) provide a card
// list (cardsView1) that isn't on the battlefield. Render those in a modal picker so they're clickable.
const pickerEl = document.getElementById('picker');
const pickerMsgEl = document.getElementById('pickerMsg');
const pickerCardsEl = document.getElementById('pickerCards');
document.getElementById('pickerDone').onclick = () => { pickerEl.style.display = 'none'; send('playerBoolean', false); };
function renderPicker(method, data) {
    const cards = data.cardsView1 ? Object.values(data.cardsView1) : [];
    const isDialog = method === 'GAME_TARGET' || method === 'GAME_SELECT' || method === 'GAME_CHOOSE_PILE';
    if (isDialog && cards.length) {
        pickerMsgEl.textContent = String(data.message || 'Choose a card').replace(/<[^>]+>/g, '');
        pickerCardsEl.innerHTML = '';
        cards.forEach(c => pickerCardsEl.appendChild(cardEl(c, true))); // click -> playerUUID(id)
        pickerEl.style.display = 'flex';
    } else if (ACTIONABLE.has(method) || method === 'GAME_OVER' || method === 'END_GAME_INFO') {
        pickerEl.style.display = 'none';
    }
}

function setPrompt(message, buttons) {
    promptMain.innerHTML = '';
    const m = document.createElement('span'); m.className = 'msg'; m.innerHTML = message; promptMain.appendChild(m);
    (buttons || []).forEach(b => {
        const btn = document.createElement('button');
        btn.textContent = b.label; if (b.alt) btn.className = 'alt';
        btn.onclick = b.onClick; promptMain.appendChild(btn);
    });
}

function handle(method, data) {
    const message = msg(data.message);
    switch (method) {
        case 'GATEWAY_HELLO': setPrompt('Connected.'); break;
        case 'GATEWAY_READY': showSetup(data); sendSkips(); setPrompt('Pick a format (and optionally a deck) then click Start game.'); break;
        case 'GATEWAY_RECONNECTED':
            setupEl.style.display = 'none'; hideBanner(); setGameActive(true);
            log('Reconnected to your game'); setPrompt('Reconnected — resuming…'); break;
        case 'GATEWAY_GAME_ENDED':
            setGameActive(false); log(esc(data.message || 'Game ended.'));
            setPrompt('Game ended. Click “New game” to start another.'); showSetup(); break;
        case 'GATEWAY_INFO': log(esc(data.message)); break;
        case 'GATEWAY_ERROR':
            showBanner(data.message || 'error'); setPrompt('<span class="over">Couldn\'t start — see the banner above.</span>');
            showSetup(); break;
        case 'START_GAME': case 'GAME_INIT':
            setupEl.style.display = 'none'; log('Game started'); setGameActive(true);
            setPrompt('Game started — waiting for the first decision…'); break;

        case 'GAME_SELECT': { // priority: play a card / declare attackers or blockers / pass
            const raw = String(data.message || '');
            if (/select attackers/i.test(raw)) {
                setPrompt('<b>⚔ Declare attackers.</b> Click your highlighted creatures to attack. '
                    + 'If there\'s more than one target (a player or a planeswalker) you\'ll then pick which to attack. '
                    + 'Click Done when finished.',
                    [{label:'Done attacking ▸', onClick:()=>send('playerBoolean', false)}]);
                break;
            }
            if (/select blockers/i.test(raw)) {
                setPrompt('<b>🛡 Declare blockers.</b> Click your creature, then click the attacker it should block. '
                    + 'Click Done when finished.',
                    [{label:'Done blocking ▸', onClick:()=>send('playerBoolean', false)}]);
                break;
            }
            const gv = lastGameView || {};
            const meP = (gv.players||[]).find(p => p.controlled);
            const myTurn = meP && gv.activePlayerId === meP.playerId;
            const hand = gv.myHand || {};
            const stack = gv.stack ? Object.values(gv.stack) : [];
            const playableHand = [...playableIds].filter(id => hand[id]).map(id => hand[id].name);
            let body;
            if (stack.length) {
                body = `<b>On the stack:</b> <span style="color:#9cf">${stack.map(c=>msg(c.name)).join(', ')}</span> `
                     + `<i>— Pass to let it resolve (or respond if you can).</i>`;
                setPrompt(body); // the inline "pass (resolve)" button on the turn line handles passing
                break;
            }
            if (playableHand.length) {
                body = `<b>Your priority.</b> You can play: <span style="color:#6e9">${playableHand.map(esc).join(', ')}</span> `
                     + `<i>— click the highlighted card, then tap lands if asked. Or pass.</i>`;
            } else {
                body = `<b>Your priority.</b> Nothing in hand is playable right now `
                     + (myTurn ? `<i>(not enough untapped mana, or wrong step — e.g. creatures only at sorcery speed in your main phase).</i>`
                               : `<i>— it's your opponent's turn (you'd only act with instants/abilities).</i>`)
                     + ` Pass, or use a skip button below to jump ahead.`;
            }
            setPrompt(body); // inline "pass ▸" button on the turn line handles passing priority
            break;
        }
        case 'GAME_PLAY_MANA': {
            const gv = lastGameView || {};
            const meP = (gv.players||[]).find(p => p.controlled);
            const pool = meP ? meP.manaPool : null;
            const btns = [];
            // spend floating mana from the pool (vs tapping lands)
            if (pool && meP) {
                MANA_COLORS.forEach(([k, type, sym]) => {
                    if (pool[k] > 0) btns.push({ label: `Spend ${sym} (${pool[k]})`,
                        onClick: () => send('playerManaType', type, { playerId: meP.playerId }) });
                });
            }
            btns.push({ label: 'Cancel cast', alt: true, onClick: () => send('playerBoolean', false) });
            // the message carries the still-needed cost (casting progress); show it prominently
            setPrompt('<b>Pay mana — still needed:</b> ' + message
                + ' <i>— click highlighted untapped lands, or spend floating mana:</i>', btns);
            break;
        }
        case 'GAME_TARGET': {
            const n = validTargets.size;
            setPrompt(message + ` <i>(click a highlighted ${n?'target':'card/player'} — ${n} available)</i>`,
                [{label:'Done / skip', onClick:()=>send('playerBoolean', false)}]);
            break;
        }
        case 'GAME_ASK':
            setPrompt(message, [
                {label:'Yes', onClick:()=>send('playerBoolean', true)},
                {label:'No', alt:true, onClick:()=>send('playerBoolean', false)},
            ]);
            break;
        case 'GAME_GET_AMOUNT': case 'GAME_PLAY_XMANA': {
            const min = data.min||0, max = data.max!==undefined?data.max:99;
            promptMain.innerHTML = '';
            const m=document.createElement('span'); m.className='msg'; m.innerHTML=message+` (${min}–${max})`; promptMain.appendChild(m);
            const inp=document.createElement('input'); inp.type='number'; inp.min=min; inp.max=max; inp.value=min; promptMain.appendChild(inp);
            const ok=document.createElement('button'); ok.textContent='OK';
            ok.onclick=()=>send('playerInteger', Math.max(min, Math.min(max, parseInt(inp.value)||min))); promptMain.appendChild(ok);
            break;
        }
        case 'GAME_CHOOSE_CHOICE': {
            const ch = data.choice || {};
            const btns = [];
            if (ch.keyChoice && ch.keyChoices) {
                for (const k in ch.keyChoices) btns.push({label: ch.keyChoices[k], onClick:()=>send('playerString', k)});
            } else {
                const opts = ch.choices || [];
                (Array.isArray(opts)?opts:Object.values(opts)).forEach(o => btns.push({label:o, onClick:()=>send('playerString', o)}));
            }
            if (!ch.required) btns.push({label:'Cancel', alt:true, onClick:()=>send('playerBoolean', false)});
            setPrompt(esc(ch.message || data.message || 'Choose'), btns);
            break;
        }
        case 'GAME_CHOOSE_ABILITY': {
            const choices = data.choices || {};
            const btns = [];
            for (const id in choices) btns.push({label: choices[id], onClick:()=>send('playerUUID', id)});
            btns.push({label:'Cancel', alt:true, onClick:()=>send('playerBoolean', false)});
            setPrompt(esc(data.message || 'Choose an ability'), btns);
            break;
        }
        case 'GAME_OVER': case 'END_GAME_INFO':
            setGameActive(false);
            setPrompt('<span class="over">Game over — ' + (esc(data.message) || 'see log') + '</span>');
            log('GAME OVER: ' + (data.message||'')); break;

        case 'GAME_UPDATE': case 'GAME_UPDATE_AND_INFORM':
            if (data.message) log(data.message);
            break;
        case 'SHOW_USERMESSAGE': {
            const t = data.message || data.text || (typeof data === 'string' ? data : JSON.stringify(data));
            showBanner(t); break; // e.g. server-side deck/join validation messages
        }
        case 'GAME_INFORM_PERSONAL': case 'GAME_ERROR': case 'CHATMESSAGE':
            if (data.message) log(data.message); break;
    }
}
</script>

</html>
