<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>XMage Web — Play vs AI</title>
    <style>
        * { box-sizing: border-box; }
        :root { --card-w: 104px; }
        body { font-family: system-ui, sans-serif; margin: 0; background: #14161a; color: #e7e7e7; }
        header { padding: 8px 14px; background: #1f242c; border-bottom: 1px solid #333;
                 display: flex; align-items: center; gap: 14px; }
        header b { color: #cfe; }
        #status { font-size: 12px; color: #8bd; }
        #turn { font-size: 12px; color: #fc9; margin-left: auto; }
        #board { padding: 10px 14px; }
        .player { border: 1px solid #2b313b; border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #1a1e24; }
        .player.me { background: #1a221c; }
        /* multiplayer: opponents are compact by default, expand to full size on hover */
        #opponents { display: flex; gap: 8px; align-items: flex-start; }
        #opponents.multi > .player { flex: 1; }
        .player.compact .zone .card { width: 56px; min-height: 78px; font-size: 8px; padding: 2px 2px 10px; }
        .player.compact .card .rules { display: none; }
        .player.compact:hover { box-shadow: 0 0 0 2px #4a6; }
        .player.compact:hover .zone .card { width: var(--card-w); min-height: calc(var(--card-w)*1.4);
                                            font-size: 10px; padding: 4px 4px 14px; }
        .player.compact:hover .card .rules { display: block; }
        #zoomwrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9ab; }
        .phead { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 6px; }
        .pname { font-weight: 700; }
        .life { color: #f88; font-weight: 700; }
        .meta { color: #9aa; font-size: 12px; }
        .active { color: #7f7; }
        .zone-label { font-size: 11px; color: #789; margin: 4px 0 2px; text-transform: uppercase; letter-spacing: .04em; }
        .zone { display: flex; flex-wrap: wrap; gap: 5px; min-height: 8px; }
        .card { width: var(--card-w); min-height: calc(var(--card-w) * 1.4); border: 1px solid #3a4150;
                border-radius: 6px; padding: 4px 4px 14px; font-size: 10px; background: #232a33; cursor: default;
                position: relative; line-height: 1.3; overflow: hidden; transition: width .12s, min-height .12s; }
        .card .cn { display: block; white-space: normal; word-break: break-word; }
        .card img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
                        border-radius: 5px; }
        .card.clickable { cursor: pointer; border-color: #5a6b86; }
        .card.clickable:hover { border-color: #9cf; background: #2b3340; }
        .card.playable { box-shadow: 0 0 0 2px #4a7; }
        .card.targetable { box-shadow: 0 0 0 3px #fd5; cursor: pointer; }
        .card.dim { opacity: .4; }
        .card.tapped { transform: rotate(8deg); opacity: .8; }
        .phead.clickable { cursor: pointer; padding: 3px 6px; border-radius: 5px; }
        .phead.clickable:hover { background: #2b3340; }
        .phead.targetable { box-shadow: 0 0 0 3px #fd5; border-radius: 5px; }
        .card .cn { font-weight: 700; color: #dde; }
        .card .cc { float: right; color: #ad8; }
        .card .ct { color: #89a; font-size: 9px; }
        .card .pt { position: absolute; right: 4px; bottom: 2px; font-weight: 700; color: #fe9; }
        .card .rules { color: #aab; font-size: 9px; margin-top: 2px; max-height: 40px; overflow: hidden; }
        #stack { border: 1px dashed #56607a; border-radius: 6px; padding: 6px; margin: 8px 0; }
        #skipbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 14px; background: #1b2028;
                   border-top: 1px solid #2b313b; }
        #skipbar button { background: #2e3a4a; font-size: 12px; padding: 5px 9px; }
        #skipbar button:hover { background: #3d4d63; }
        #prompt { position: sticky; bottom: 0; background: #232a36; border-top: 2px solid #3a587e;
                  padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        #prompt .msg { font-size: 14px; color: #fff; flex: 1 1 280px; }
        button { background: #34507a; color: #fff; border: 0; border-radius: 5px; padding: 7px 14px;
                 font-size: 13px; cursor: pointer; }
        button:hover { background: #4767a0; }
        button.alt { background: #5a3a3a; } button.alt:hover { background: #784c4c; }
        #log { padding: 6px 14px; max-height: 150px; overflow: auto; font-size: 11px; color: #8a9; border-top: 1px solid #2b313b; font-family: ui-monospace, monospace; }
        #log .sent { color: #9cf; } #log .recv { color: #7a8; } #log .err { color: #f88; font-weight: 700; }
        .card.playable { box-shadow: 0 0 0 3px #5d7; }
        .card.playable::after { content: '▶ play'; position: absolute; left: 4px; bottom: 2px; font-size: 8px; color: #6e9; }
        #banner { display:none; padding: 8px 14px; background: #5a2a2a; color: #fdd; font-size: 13px; }
        input[type=number] { width: 70px; padding: 5px; }
        .over { color: #fe7; font-size: 16px; font-weight: 700; }
        .overlay { position: fixed; inset: 0; background: rgba(8,10,13,.82); display: flex;
                   align-items: center; justify-content: center; z-index: 50; }
        .overlay .panel { width: min(560px, 92vw); background: #1c2230; border: 1px solid #38445a;
                          border-radius: 10px; padding: 18px 20px; }
        .overlay h2 { margin: 0 0 12px; color: #cfe; }
        .overlay label { display: block; font-size: 13px; color: #bcd; margin: 10px 0 4px; }
        .overlay select { padding: 6px; font-size: 14px; min-width: 260px; }
        .overlay textarea { width: 100%; height: 180px; background: #11151b; color: #dde; border: 1px solid #38445a;
                            border-radius: 6px; padding: 8px; font-family: ui-monospace, monospace; font-size: 12px; }
        .overlay .hint { font-size: 11px; color: #89a; margin-top: 8px; }
        .overlay #startBtn { margin-top: 12px; font-size: 15px; padding: 9px 20px; }
        #newGameBtn { background: #2e6a40; font-size: 12px; padding: 5px 12px; }
        #newGameBtn:hover { background: #3c8a54; }
    </style>
</head>
<body>
<header>
    <b>XMage Web</b> — play vs AI
    <span id="status">connecting…</span>
    <button id="newGameBtn">New game</button>
    <span id="zoomwrap">🔍 <input type="range" id="zoom" min="64" max="200" step="4" value="104"></span>
    <span id="turn"></span>
</header>

<div id="setup" class="overlay" style="display:none">
    <div class="panel">
        <h2>New game vs AI</h2>
        <label for="formatSel">Format</label>
        <select id="formatSel"></select>
        <div id="deckSourceWrap" style="display:none">
            <label for="deckSourceSel">Load a deck from <span id="deckSourceLabel">your site</span></label>
            <select id="deckSourceSel"><option value="">— none (use pasted or random) —</option></select>
        </div>
        <label for="deckInput">Your deck — paste a decklist, or leave blank for a random deck</label>
        <textarea id="deckInput" placeholder="4 Lightning Bolt&#10;4 Monastery Swiftspear&#10;20 Mountain&#10;...&#10;&#10;(plain '<count> <card name>' per line, or paste an XMage .dck)"></textarea>
        <div><button id="startBtn">Start game</button></div>
        <div class="hint">Random decks work for any non-Commander format. Commander needs a real deck with a commander (paste a .dck).</div>
    </div>
</div>

<div id="banner"></div>
<div id="board">
    <div id="opponents"></div>
    <div id="stack"><div class="zone-label">Stack</div><div id="stackZone" class="zone"></div></div>
    <div id="me" class="player me"></div>
</div>

<div id="skipbar"></div>
<div id="prompt"><span class="msg">waiting…</span></div>
<div id="log"></div>

<script>
const statusEl = document.getElementById('status');
const turnEl = document.getElementById('turn');
const opponentsEl = document.getElementById('opponents');
const meEl = document.getElementById('me');
const stackZone = document.getElementById('stackZone');
const promptEl = document.getElementById('prompt');
const logEl = document.getElementById('log');

// card zoom (persisted)
const zoom = document.getElementById('zoom');
const savedZoom = localStorage.getItem('cardZoom');
if (savedZoom) { zoom.value = savedZoom; document.documentElement.style.setProperty('--card-w', savedZoom + 'px'); }
zoom.oninput = () => {
    document.documentElement.style.setProperty('--card-w', zoom.value + 'px');
    localStorage.setItem('cardZoom', zoom.value);
};

// surface any JS error on-screen (so issues are visible without devtools)
function showError(text) {
    const b = document.getElementById('banner');
    b.style.display = 'block'; b.textContent = 'JS error: ' + text;
    logc('err', '⚠ ' + text);
}
window.onerror = (m, src, line, col) => { showError(m + ' @' + line + ':' + col); };
window.addEventListener('unhandledrejection', e => showError('promise: ' + (e.reason && e.reason.message || e.reason)));

const ws = new WebSocket(`ws://${location.host}/ws/spectate`);
ws.onopen = () => statusEl.textContent = 'connected';
ws.onclose = () => statusEl.textContent = 'disconnected';
ws.onerror = () => statusEl.textContent = 'error';

let lastGameView = null;
let playableIds = new Set();
let validTargets = new Set();  // ids the server is currently asking us to pick (cards OR players)
let priorityActive = false;    // true while the server is asking us to act at priority (GAME_SELECT)
let myHandIds = new Set();      // ids of cards in our hand (to dim the un-castable ones at priority)

// callbacks that START a fresh decision (so stale target highlights should clear)
const ACTIONABLE = new Set(['GAME_SELECT','GAME_PLAY_MANA','GAME_ASK','GAME_GET_AMOUNT',
    'GAME_PLAY_XMANA','GAME_CHOOSE_CHOICE','GAME_CHOOSE_ABILITY','GAME_CHOOSE_PILE']);

function send(action, value, extra) {
    const m = Object.assign({ action }, extra || {});
    if (value !== undefined && value !== null) m.value = value;
    if (ws.readyState !== WebSocket.OPEN) { showError('socket not open (state ' + ws.readyState + ')'); return; }
    ws.send(JSON.stringify(m));
    logc('sent', '→ ' + action + (value !== undefined ? ' ' + value : ''));
}
// players are valid targets/choices too (e.g. "select a starting player", "target player")
window.pickPlayer = (playerId) => send('playerUUID', playerId);

function act(a) { send('playerAction', a); }
// XMage-style skip shortcuts (matches the desktop F-keys)
const SKIPS = [
    {label:'Pass (F2)',        key:'F2', fn:()=>send('playerBoolean', false)},
    {label:'Next main (F5)',   key:'F5', fn:()=>act('PASS_PRIORITY_UNTIL_NEXT_MAIN_PHASE')},
    {label:'End of turn (F6)', key:'F6', fn:()=>act('PASS_PRIORITY_UNTIL_TURN_END_STEP')},
    {label:'Next turn (F4)',   key:'F4', fn:()=>act('PASS_PRIORITY_UNTIL_NEXT_TURN')},
    {label:'My next turn (F7)',key:'F7', fn:()=>act('PASS_PRIORITY_UNTIL_MY_NEXT_TURN')},
    {label:'Resolve stack (F9)',key:'F9',fn:()=>act('PASS_PRIORITY_UNTIL_STACK_RESOLVED')},
    {label:'Cancel skips (F3)',key:'F3', fn:()=>act('PASS_PRIORITY_CANCEL_ALL_ACTIONS')},
];
const skipbar = document.getElementById('skipbar');
SKIPS.forEach(s => { const b=document.createElement('button'); b.textContent=s.label; b.onclick=s.fn; skipbar.appendChild(b); });
document.addEventListener('keydown', (e) => {
    if (document.getElementById('setup').style.display !== 'none') return; // don't skip while typing a deck
    const s = SKIPS.find(x => x.key === e.key);
    if (s) { e.preventDefault(); s.fn(); }
});

// --- game setup (format + deck) ---
const setupEl = document.getElementById('setup');
const formatSel = document.getElementById('formatSel');
const deckInput = document.getElementById('deckInput');
let readyData = null;
const deckSourceSel = document.getElementById('deckSourceSel');
function populateSetup() {
    if (!readyData) return;
    if (formatSel.options.length === 0 && readyData.formats) {
        readyData.formats.forEach(f => { const o=document.createElement('option'); o.value=f.key; o.textContent=f.label; formatSel.appendChild(o); });
    }
    if (readyData.decks && deckSourceSel.options.length <= 1) {
        document.getElementById('deckSourceLabel').textContent = readyData.deckSourceLabel || 'your site';
        readyData.decks.forEach(d => {
            const o=document.createElement('option'); o.value=d.id;
            o.textContent = d.name + (d.commander ? ' — ' + d.commander : '');
            deckSourceSel.appendChild(o);
        });
        document.getElementById('deckSourceWrap').style.display = 'block';
        // a site deck is a Commander deck; default the format to Commander 1v1 if available
        const cmd = [...formatSel.options].find(o => o.value === 'commander');
        if (cmd) deckSourceSel.onchange = () => { if (deckSourceSel.value && formatSel.value.indexOf('commander') < 0) formatSel.value = 'commander'; };
    }
}
function showSetup(ready) {
    if (ready) { readyData = ready; populateSetup(); }
    setupEl.style.display = 'flex';
}
document.getElementById('startBtn').onclick = () => {
    document.getElementById('banner').style.display = 'none';
    const deckId = deckSourceSel.value;
    send('newGame', undefined, { format: formatSel.value, deck: deckId ? '' : deckInput.value, deckId });
    setupEl.style.display = 'none';
    setPrompt('Starting game…');
};
document.getElementById('newGameBtn').onclick = () => showSetup();
function log(s) { logc('', s); }
function logc(cls, s) {
    const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = s;
    logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
    while (logEl.childNodes.length > 200) logEl.removeChild(logEl.firstChild);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function untappedLandIds(gv) {
    const me = (gv.players||[]).find(p => p.controlled);
    if (!me || !me.battlefield) return [];
    return Object.entries(me.battlefield)
        .filter(([id,p]) => (p.cardTypes||[]).includes('LAND') && !p.tapped)
        .map(([id]) => id);
}

ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { showError('bad JSON frame'); return; }
    const data = msg.data || {};
    if (msg.method && msg.method.startsWith('GAME_') && msg.method !== 'GAME_UPDATE')
        logc('recv', '← ' + msg.method + (data.message ? ': ' + data.message : ''));
    try {
        // update the valid-target highlight set BEFORE rendering, so highlights show this frame
        if (msg.method === 'GAME_TARGET') validTargets = new Set(data.targets || []);
        else if (msg.method === 'GAME_PLAY_MANA') validTargets = new Set(untappedLandIds(data.gameView || {}));
        else if (ACTIONABLE.has(msg.method)) validTargets = new Set();
        priorityActive = (msg.method === 'GAME_SELECT');
        const gv = data.gameView || (data.players ? data : null);
        if (gv) { lastGameView = gv; computePlayable(gv); renderBoard(gv); }
        handle(msg.method, data);
    } catch (e) {
        showError((e && e.message || e) + ' (method ' + msg.method + ')');
    }
};

function computePlayable(gv) {
    playableIds = new Set();
    const cpo = gv.canPlayObjects;
    if (!cpo) return;
    // PlayableObjectsList shapes vary; collect any UUID-looking keys/ids we can find
    const scan = (o) => {
        if (!o) return;
        if (Array.isArray(o)) o.forEach(scan);
        else if (typeof o === 'object') {
            for (const k in o) {
                if (/^[0-9a-f]{8}-[0-9a-f]{4}-/.test(k)) playableIds.add(k);
                scan(o[k]);
            }
        }
    };
    scan(cpo);
}

function cardEl(card, clickable) {
    const d = document.createElement('div');
    const isTarget = validTargets.has(card.id);
    // at priority, dim hand cards we can't play right now (wrong phase / not enough mana / not our turn)
    const dim = priorityActive && myHandIds.has(card.id) && !playableIds.has(card.id) && !isTarget;
    d.className = 'card' + (clickable ? ' clickable' : '')
        + (playableIds.has(card.id) ? ' playable' : '')
        + (isTarget ? ' targetable' : '')
        + (dim ? ' dim' : '')
        + (card.tapped ? ' tapped' : '');
    const cost = card.manaCostStr || (Array.isArray(card.manaCost) ? card.manaCost.join('') : '') || '';
    const types = [].concat(card.superTypes||[], card.cardTypes||[], card.subTypes||[]).join(' ');
    const pt = (card.power !== undefined && (card.cardTypes||[]).includes('CREATURE'))
        ? `${card.power}/${card.toughness}` : '';
    d.innerHTML = `<span class="cc">${esc(cost)}</span><span class="cn">${esc(card.name||'?')}</span>`
        + `<div class="ct">${esc(types)}</div>`
        + (card.rules && card.rules.length ? `<div class="rules">${esc(card.rules.join(' • '))}</div>` : '')
        + (pt ? `<div class="pt">${esc(pt)}</div>` : '');
    d.title = `${card.name||'?'}${cost?'  '+cost:''}${pt?'  '+pt:''}`
        + (types?'\n'+types:'') + (card.rules&&card.rules.length?'\n\n'+card.rules.join('\n'):'');
    // real card art from Scryfall (set + collector number); on failure, the text card shows through.
    // command-zone objects expose imageNumber instead of cardNumber.
    const rawNum = card.cardNumber || (card.imageNumber ? String(card.imageNumber) : null);
    if (card.expansionSetCode && rawNum && !card.faceDown) {
        const img = document.createElement('img');
        img.className = 'art'; img.loading = 'lazy'; img.alt = card.name || '';
        const set = encodeURIComponent(String(card.expansionSetCode).toLowerCase());
        img.src = `/img/${set}/${encodeURIComponent(rawNum)}`;
        img.onerror = () => img.remove();
        d.appendChild(img);
    }
    if (clickable) d.onclick = () => send('playerUUID', card.id);
    return d;
}

function zone(label, cardsMap, clickable) {
    const wrap = document.createElement('div');
    const l = document.createElement('div'); l.className = 'zone-label'; l.textContent = label;
    const z = document.createElement('div'); z.className = 'zone';
    const cards = cardsMap ? Object.values(cardsMap) : [];
    for (const c of cards) z.appendChild(cardEl(c, clickable));
    if (!cards.length) { const e = document.createElement('span'); e.className='meta'; e.textContent='—'; z.appendChild(e); }
    wrap.appendChild(l); wrap.appendChild(z);
    return wrap;
}

function renderBoard(gv) {
    const me = gv.players.find(p => p.controlled) || gv.players[0];
    myHandIds = new Set(Object.keys(gv.myHand || {}));
    const myTurn = gv.activePlayerId === me.playerId;
    turnEl.innerHTML = `Turn ${gv.turn} · ${esc(gv.step||gv.phase||'')} · `
        + (myTurn ? '<span style="color:#7f7">YOUR TURN</span>' : '<span style="color:#fa8">Opponent\'s turn</span>');

    function pheadHtml(p, active) {
        const tgt = validTargets.has(p.playerId) ? ' targetable' : '';
        return `<div class="phead clickable${tgt}" onclick="pickPlayer('${p.playerId}')" title="click to target this player">`
            + `<span class="pname">${esc(p.name)}</span> `
            + `<span class="life">♥ ${p.life}</span> `
            + `<span class="meta">hand ${p.handCount} · lib ${p.libraryCount} · gy ${Object.keys(p.graveyard||{}).length}</span>`
            + (active ? ` <span class="active">● active</span>` : '') + `</div>`;
    }

    // opponents: compact + hover-to-zoom when there's more than one (3-4 player games)
    const opponents = gv.players.filter(p => p !== me);
    opponentsEl.innerHTML = '';
    opponentsEl.className = opponents.length > 1 ? 'multi' : '';
    for (const opp of opponents) {
        const panel = document.createElement('div');
        panel.className = 'player' + (opponents.length > 1 ? ' compact' : '');
        panel.innerHTML = pheadHtml(opp, gv.activePlayerId === opp.playerId);
        panel.appendChild(zone('Battlefield', opp.battlefield, true)); // clickable as targets
        if (opp.commandList && opp.commandList.length) panel.appendChild(zone('Command', opp.commandList, true));
        opponentsEl.appendChild(panel);
    }

    meEl.innerHTML = pheadHtml(me, myTurn);
    meEl.appendChild(zone('My battlefield', me.battlefield, true));
    if (me.commandList && me.commandList.length) meEl.appendChild(zone('Command zone (click to cast)', me.commandList, true));
    meEl.appendChild(zone('My hand', gv.myHand, true));

    stackZone.innerHTML = '';
    const stack = gv.stack ? Object.values(gv.stack) : [];
    if (!stack.length) stackZone.innerHTML = '<span class="meta">empty</span>';
    else stack.forEach(c => stackZone.appendChild(cardEl(c, false)));
}

function setPrompt(message, buttons) {
    promptEl.innerHTML = '';
    const m = document.createElement('span'); m.className = 'msg'; m.innerHTML = message; promptEl.appendChild(m);
    (buttons || []).forEach(b => {
        const btn = document.createElement('button');
        btn.textContent = b.label; if (b.alt) btn.className = 'alt';
        btn.onclick = b.onClick; promptEl.appendChild(btn);
    });
}

function handle(method, data) {
    const message = esc(data.message || '');
    switch (method) {
        case 'GATEWAY_HELLO': setPrompt('Connected.'); break;
        case 'GATEWAY_READY': showSetup(data); setPrompt('Pick a format (and optionally a deck) then click Start game.'); break;
        case 'GATEWAY_INFO': log(esc(data.message)); break;
        case 'GATEWAY_ERROR':
            showError(data.message); setPrompt('<span class="over">' + esc(data.message) + '</span>');
            showSetup(); break;
        case 'START_GAME': case 'GAME_INIT':
            setupEl.style.display = 'none'; log('Game started');
            setPrompt('Game started — waiting for the first decision…'); break;

        case 'GAME_SELECT': { // priority: play a card (click) or pass
            const gv = lastGameView || {};
            const meP = (gv.players||[]).find(p => p.controlled);
            const myTurn = meP && gv.activePlayerId === meP.playerId;
            const hand = gv.myHand || {};
            const stack = gv.stack ? Object.values(gv.stack) : [];
            const playableHand = [...playableIds].filter(id => hand[id]).map(id => hand[id].name);
            let body;
            if (stack.length) {
                body = `<b>On the stack:</b> <span style="color:#9cf">${stack.map(c=>esc(c.name)).join(', ')}</span> `
                     + `<i>— Pass to let it resolve (or respond if you can).</i>`;
                setPrompt(body, [{label:'Pass (resolve) ▸', onClick:()=>send('playerBoolean', false)}]);
                break;
            }
            if (playableHand.length) {
                body = `<b>Your priority.</b> You can play: <span style="color:#6e9">${playableHand.map(esc).join(', ')}</span> `
                     + `<i>— click the highlighted card, then tap lands if asked. Or pass.</i>`;
            } else {
                body = `<b>Your priority.</b> Nothing in hand is playable right now `
                     + (myTurn ? `<i>(not enough untapped mana, or wrong step — e.g. creatures only at sorcery speed in your main phase).</i>`
                               : `<i>— it's your opponent's turn (you'd only act with instants/abilities).</i>`)
                     + ` Pass, or use a skip button below to jump ahead.`;
            }
            setPrompt(body, [{label:'Pass priority ▸', alt:true, onClick:()=>send('playerBoolean', false)}]);
            break;
        }
        case 'GAME_PLAY_MANA':
            setPrompt('<b>Pay mana:</b> ' + message + ' <i>— click your highlighted untapped lands to tap them.</i>',
                [{label:'Cancel cast', alt:true, onClick:()=>send('playerBoolean', false)}]);
            break;
        case 'GAME_TARGET': {
            const n = validTargets.size;
            setPrompt(message + ` <i>(click a highlighted ${n?'target':'card/player'} — ${n} available)</i>`,
                [{label:'Done / skip', onClick:()=>send('playerBoolean', false)}]);
            break;
        }
        case 'GAME_ASK':
            setPrompt(message, [
                {label:'Yes', onClick:()=>send('playerBoolean', true)},
                {label:'No', alt:true, onClick:()=>send('playerBoolean', false)},
            ]);
            break;
        case 'GAME_GET_AMOUNT': case 'GAME_PLAY_XMANA': {
            const min = data.min||0, max = data.max!==undefined?data.max:99;
            promptEl.innerHTML = '';
            const m=document.createElement('span'); m.className='msg'; m.innerHTML=message+` (${min}–${max})`; promptEl.appendChild(m);
            const inp=document.createElement('input'); inp.type='number'; inp.min=min; inp.max=max; inp.value=min; promptEl.appendChild(inp);
            const ok=document.createElement('button'); ok.textContent='OK';
            ok.onclick=()=>send('playerInteger', Math.max(min, Math.min(max, parseInt(inp.value)||min))); promptEl.appendChild(ok);
            break;
        }
        case 'GAME_CHOOSE_CHOICE': {
            const ch = data.choice || {};
            const btns = [];
            if (ch.keyChoice && ch.keyChoices) {
                for (const k in ch.keyChoices) btns.push({label: ch.keyChoices[k], onClick:()=>send('playerString', k)});
            } else {
                const opts = ch.choices || [];
                (Array.isArray(opts)?opts:Object.values(opts)).forEach(o => btns.push({label:o, onClick:()=>send('playerString', o)}));
            }
            if (!ch.required) btns.push({label:'Cancel', alt:true, onClick:()=>send('playerBoolean', false)});
            setPrompt(esc(ch.message || data.message || 'Choose'), btns);
            break;
        }
        case 'GAME_CHOOSE_ABILITY': {
            const choices = data.choices || {};
            const btns = [];
            for (const id in choices) btns.push({label: choices[id], onClick:()=>send('playerUUID', id)});
            btns.push({label:'Cancel', alt:true, onClick:()=>send('playerBoolean', false)});
            setPrompt(esc(data.message || 'Choose an ability'), btns);
            break;
        }
        case 'GAME_OVER': case 'END_GAME_INFO':
            setPrompt('<span class="over">Game over — ' + (esc(data.message) || 'see log') + '</span>');
            log('GAME OVER: ' + (data.message||'')); break;

        case 'GAME_UPDATE': case 'GAME_UPDATE_AND_INFORM':
            if (data.message) log(data.message);
            break;
        case 'GAME_INFORM_PERSONAL': case 'GAME_ERROR': case 'SHOW_USERMESSAGE': case 'CHATMESSAGE':
            if (data.message) log(data.message); break;
    }
}
</script>
</body>
</html>
